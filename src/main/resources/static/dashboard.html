<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control</title>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/notify.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/scroll.css" />
    <script src="js/components/navbarElement.js"></script>
    <script src="js/components/confirmDialog.js"></script>
  </head>
  <body class="h-full transition-colors duration-200 flex flex-col font-sans">
    <main-header></main-header>

    <div class="flex flex-1 overflow-hidden">
      <app-sidebar></app-sidebar>

      <main class="flex-1 overflow-y-auto p-6 md:p-8 mt-[30px]">
        <div
          id="view-listado"
          class="space-y-8 transition-opacity duration-300"
        >
          <div id="notify-container"></div>

          <div
            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
          >
            <div id="titulo-user"></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex flex-column hover:border-green-500/30"
            >
              <div class="w-100 flex items-center justify-between">
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Ganancia
                </p>
                <div
                  class="w-9 h-9 bg-green-500/30 text-green-600 text-[20px] rounded-xl flex justify-center items-center border-1 border-green-400/30"
                >
                  <i
                    data-lucide="banknote-arrow-up"
                    class="w-5 h-5 shrink-0"
                  ></i>
                </div>
              </div>
              <div class="">
                <h3 id="panel-ganancia" class="text-[24px] mt-1 font-bold"></h3>
              </div>
            </div>

            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex flex-column hover:border-blue-500/30"
            >
              <div class="w-100 flex items-center justify-between">
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Productos Activos
                </p>
                <div
                  class="w-9 h-9 bg-blue-500/30 text-blue-600 text-[20px] rounded-xl flex justify-center items-center border-1 border-blue-400/30"
                >
                  <i data-lucide="package" class="w-5 h-5 shrink-0"></i>
                </div>
              </div>
              <div class="">
                <h3 id="panel-producto" class="text-[24px] mt-1 font-bold">
                  0
                </h3>
              </div>
            </div>

            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex flex-column hover:border-yellow-500/30"
            >
              <div class="w-100 flex items-center justify-between">
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Pedidos Pendientes
                </p>
                <div
                  class="w-9 h-9 bg-yellow-500/30 text-yellow-600 text-[20px] rounded-xl flex justify-center items-center border-1 border-yellow-400/30"
                >
                  <i data-lucide="triangle-alert" class="w-5 h-5 shrink-0"></i>
                </div>
              </div>
              <div class="">
                <h4 id="panel-pendientes" class="text-[24px] mt-1 font-bold">
                  0
                </h4>
              </div>
            </div>

            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex flex-column hover:border-yellow-500/30"
            >
              <div class="w-100 flex items-center justify-between">
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Alerta de Stock
                </p>
                <div
                  class="w-9 h-9 bg-yellow-500/30 text-yellow-600 text-[20px] rounded-xl flex justify-center items-center border-1 border-yellow-400/30"
                >
                  <i data-lucide="triangle-alert" class="w-5 h-5 shrink-0"></i>
                </div>
              </div>
              <div class="">
                <h3 id="panel-stock" class="text-[24px] mt-1 font-bold">0</h3>
              </div>
            </div>
          </div>

          <div class="grid col-12 gap-6 d-flex justify-content-center p-3">
            <div
              class="dashboard-bg p-4 col-8 shadow-sm flex flex-column rounded-2xl"
            >
              <p
                class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >
                Pedidos Recientes
              </p>
              <div class="contains-table w-100">
                <table class="w-100">
                  <thead class="border-b">
                    <tr class="">
                      <th>Id</th>
                      <th>Cliente</th>
                      <th>Total</th>
                      <th>Estado</th>
                    </tr>
                  </thead>
                  <tbody id="tbody-ultimos-pedidos"></tbody>
                </table>
              </div>
            </div>
            <div
              class="dashboard-bg p-4 col-4 shadow-sm flex flex-column rounded-2xl"
            >
              <p
                class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >
                Stock Critico
              </p>
              <div class="contains-table w-100">
                <table class="w-100">
                  <thead class="border-b head-table">
                    <tr>
                      <th>Producto</th>
                      <th>Stock</th>
                    </tr>
                  </thead>
                  <tbody id="tbody-stock"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <script src="js/utils/theme.js"></script>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/userInfo.js"></script>
    <script type="module" src="js/utils/dashboard.js"></script>
    <script src="js/components/sidebarElement.js"></script>
  </body>
</html>
