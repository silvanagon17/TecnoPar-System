<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | TecnoPar</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header class="sticky position-fixed w-100 top-0 z-50 pre-scrollable">
      <div
        class="nav-principal w-100 px-6 py-3 flex justify-between items-center gap-4"
      >
        <div class="d-flex items-center gap-2 cursor-pointer">
          <div>
            <img
              src="image/estatico/logoTecnoPar.png"
              class="logo mr-2"
              style="width: 30px"
              alt="Logo TecnoPar"
            />
          </div>
          <span class="titulo text-blue-500">TecnoPar</span>
        </div>

        <div class="flex items-center gap-4">
          <div class="mini-switch-container">
            <input type="checkbox" id="checkbox" class="checkbox-input" />
            <label for="checkbox" class="mini-label">
              <span class="icon-small"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                  />
                </svg>
              </span>
              <span class="icon-small"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                  />
                </svg>
              </span>
              <div class="ball"></div>
            </label>
          </div>

          <button
            class="flex items-center gap-2 hover:text-blue-400 transition group"
          >
            <div
              class="w-9 h-9 rounded-full flex items-center justify-center group-hover:bg-slate-800 transition principal"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="hidden lg:block text-left">
              <p class="text-[10px] leading-none">Mi Cuenta</p>
              <p class="text-xs font-bold leading-tight">Silvana Quintana</p>
            </div>
          </button>

          <button
            popovertarget="notificacion-sidebar"
            class="relative p-2.5 rounded-xl transition principal"
          >
            <i class="bi bi-bell-fill fs-5"></i>
            <span
              id="cart-count"
              class="absolute top-0 right-0 bg-blue-600 text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-slate-950"
              >3</span
            >
          </button>
        </div>
      </div>

      <nav class="nav-secundario border-y py-1">
        <div
          class="mx-auto px-6 flex items-center gap-8 text-[13px] font-medium"
        >
          <el-dropdown
            class="relative inline-flex flex-col items-start text-left"
          >
            <button
              popovertarget="menu-sidebar"
              class="inline-flex w-auto items-center flex gap-2 font-bold text-xs uppercase tracking-widest whitespace-nowrap hover:text-blue-600 justify-center gap-x-1.5 rounded-md py-2 text-sm font-semibold inset-ring-1 inset-ring-white/5 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
              Todo
            </button>
          </el-dropdown>

          <div
            class="flex items-center gap-8 text-[12px] font-bold uppercase tracking-wider"
          >
            <a href="#">Panel Inicial</a>
            <div class="dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Registro
              </a>
              <ul class="dropdown-menu nav-secundario">
                <li class="">
                  <a
                    class="dropdown-item hover:bg-blue-600"
                    href="categoria.html"
                    >Categoría</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item hover:bg-blue-600"
                    href="producto.html"
                    >Producto</a
                  >
                </li>
              </ul>
            </div>
            <div class="dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Listado
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item hover:bg-blue-600" href="#"
                    >Cliente</a
                  >
                </li>
                <li class="">
                  <a class="dropdown-item hover:bg-blue-600" href="#"
                    >Categoría</a
                  >
                </li>
                <li>
                  <a class="dropdown-item hover:bg-blue-600" href="#"
                    >Producto</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>
  </body>
</html>
