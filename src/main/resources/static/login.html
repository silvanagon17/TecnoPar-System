<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/scroll.css" />
  </head>
  <body
    class="formulario h-full transition-colors duration-200 flex flex-col font-sans"
  >
    <header class="sticky position-fixed w-100 top-0 z-50 pre-scrollable">
      <div
        class="nav-principal-2 w-100 px-6 py-[12px] flex justify-between items-center gap-4"
      >
        <div class="d-flex items-center gap-2 cursor-pointer">
          <div>
            <img
              src="image/estatico/logoTecnoPar.png"
              class="logo mr-2"
              style="width: 26px"
              alt="Logo TecnoPar"
            />
          </div>
          <span class="titulo text-blue-500">TecnoPar</span>
        </div>

        <div class="flex items-center justify-content-between gap-4">
          <div class="mini-switch-container">
            <input type="checkbox" id="checkbox" class="checkbox-input" />
            <label for="checkbox" class="mini-label principal">
              <span class="icon-small">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.25"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                  />
                </svg>
              </span>
              <span class="icon-small"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.25"
                  stroke="currentColor"
                  class="size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                  />
                </svg>
              </span>
              <div class="ball"></div>
            </label>
          </div>

          <div class="user">
            <button
              class="flex justify-content-center items-center gap-2 transition group px-2 py-1"
              title="Volver a la tienda"
            >
              <a href="index.html"
                ><i data-lucide="house" class="w-6 h-6" stroke-width="1.25"></i
              ></a>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="form-main" id="view-login">
      <div class="form-content shadow-lg">
        <div class="box">
          <h3>Iniciar Sesion</h3>
          <form action="" id="loginForm">
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Correo<span class="text-red-400">*</span>
              </label>
              <div class="input-control d-flex align-items-center w-100">
                <i
                  data-lucide="mail"
                  class="w-4 h-4 text-slate-400 mr-2 flex-shrink-0"
                ></i>
                <input
                  type="email"
                  id="loginEmail"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>
            </div>
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Contraseña <span class="text-red-400">*</span>
              </label>
              <div
                class="input-control d-flex align-items-center w-100 justify-content-between"
              >
                <div class="d-flex align-items-center w-100">
                  <i
                    data-lucide="key-round"
                    class="w-4 h-4 text-slate-400 mr-2 flex-shrink-0"
                  ></i>
                  <input
                    type="password"
                    id="loginPassword"
                    placeholder="*********"
                    required
                  />
                </div>
              </div>
              <div class="input-link text-right mt-1">
                <a
                  href="#"
                  onclick="showDemoInfo(event)"
                  class="text-blue-600 dark:text-blue-400 text-xs hover:underline"
                  >¿Has olvidado la contraseña?</a
                >
              </div>

              <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 w-100 py-2.5 rounded-xl my-2 text-white font-bold text-sm shadow-md shadow-blue-600/30 transition"
              >
                Iniciar Sesión
              </button>
            </div>
          </form>
          <div
            class="footer d-flex justify-content-center align-items-center pt-3"
          >
            <p class="">¿No tienes una cuenta?</p>
            <button
              id="crearCuenta"
              class="text-blue-600 pl-2"
              onclick="goToCrearView()"
            >
              Crear cuenta
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="view-form" class="hidden form-main">
      <div class="form-content shadow-lg">
        <div class="box">
          <h3>sign up</h3>
          <form action="" id="registroForm">
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Nombre<span class="text-red-400">*</span>
              </label>
              <div class="input-control d-flex align-items-center w-100">
                <input
                  type="text"
                  id="registroNombre"
                  placeholder="Nombre"
                  required
                />
              </div>
            </div>
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Apellido<span class="text-red-400">*</span>
              </label>
              <div class="input-control d-flex align-items-center w-100">
                <input
                  type="text"
                  id="registroApellido"
                  placeholder="Apellido"
                  required
                />
              </div>
            </div>
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Correo<span class="text-red-400">*</span>
              </label>
              <div class="input-control d-flex align-items-center w-100">
                <i
                  data-lucide="mail"
                  class="w-4 h-4 text-slate-400 mr-2 flex-shrink-0"
                ></i>
                <input
                  type="email"
                  id="registroEmail"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>
            </div>
            <div class="input-box">
              <label
                class="c-title block text-start text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400 mb-1"
              >
                Contraseña <span class="text-red-400">*</span>
              </label>
              <div
                class="input-control d-flex align-items-center w-100 justify-content-between"
              >
                <div class="d-flex align-items-center w-100">
                  <i
                    data-lucide="key-round"
                    class="w-4 h-4 text-slate-400 mr-2 flex-shrink-0"
                  ></i>
                  <input
                    type="password"
                    id="registroPassword"
                    placeholder="*********"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 w-100 py-2.5 rounded-xl my-2 text-white font-bold text-sm shadow-md shadow-blue-600/30 transition"
              >
                Crear Cuenta
              </button>
            </div>
          </form>
          <div
            class="footer d-flex justify-content-center align-items-center pt-3"
          >
            <p class="">¿Ya tienes cuenta?</p>
            <button class="text-blue-600 pl-2" onclick="goToLoginView()">
              Iniciar Sesión
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script>
      function goToLoginView() {
        const viewForm = document.getElementById("view-form");
        const viewLogin = document.getElementById("view-login");

        viewLogin.classList.remove("hidden");
        viewForm.classList.add("hidden");
      }

      function goToCrearView() {
        document.getElementById("view-login").classList.add("hidden");
        document.getElementById("view-form").classList.remove("hidden");
      }
    </script>
    <script src="js/utils/theme.js"></script>
    <script src="js/utils/scroll.js"></script>
    <script src="js/controllers/authController.js"></script>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
  </body>
</html>
