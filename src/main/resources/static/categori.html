    <script>
      const fileInput = document.getElementById("dropzone-file");
      const previewContainer = document.getElementById("preview-container");
      const imagePreview = document.getElementById("image-preview");
      const fileName = document.getElementById("file-name");
      const uploadArea = document.getElementById("upload-area");
      const removeButton = document.getElementById("remove-button");

      // Escuchar el cambio en el input file
      fileInput.addEventListener("change", function (e) {
        const file = e.target.files[0]; // agarrar el primer archivo

        if (file) {
          // Verificar que sea una imagen (seguridad extra)
          if (!file.type.startsWith("image/")) {
            alert("Por favor, selecciona un archivo de imagen válido.");
            return;
          }

          const reader = new FileReader();

          // Definir qué hacer cuando el archivo se haya cargado
          reader.onload = function (event) {
            imagePreview.src = event.target.result;
            fileName.textContent = file.name;
            uploadArea.classList.add("hidden");
            previewContainer.classList.remove("hidden");
          };

          // Leer el archivo como una URL de datos (Base64)
          reader.readAsDataURL(file);
        }
      });

      // Función para resetear el campo
      removeButton.addEventListener("click", function () {
        fileInput.value = ""; // Limpiar el input
        imagePreview.src = "";
        fileName.textContent = "";
        uploadArea.classList.remove("hidden");
        previewContainer.classList.add("hidden");
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const url = window.location.pathname.split("/").pop();

        document
          .querySelectorAll(".nav-link, .dropdown-item")
          .forEach((link) => {
            const href = link.getAttribute("href");

            if (href && href === url) {
              link.classList.add("active");

              const dropdown = link.closest(".dropdown");
              if (dropdown) {
                dropdown.querySelector(".nav-link").classList.add("active");
              }
            }
          });
      });
    </script>
