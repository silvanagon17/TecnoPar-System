<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos</title>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/notify.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/scroll.css" />
    <script src="js/components/navbarElement.js"></script>
    <script src="js/components/confirmDialog.js"></script>
  </head>
  <body class="h-full transition-colors duration-200 flex flex-col font-sans">
    <main-header></main-header>
    <div class="flex w-full min-h-screen">
      <app-sidebar></app-sidebar>

      <main class="flex-1 min-w-0 p-6 md:p-8 mt-[30px]">
        <app-confirm-dialog id="confirm-modal"></app-confirm-dialog>
        <div
          id="view-listado"
          class="space-y-8 transition-opacity duration-300"
        >
          <div id="notify-container"></div>

          <div
            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
          >
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                Pedidos
              </h2>
            </div>
          </div>

          <div class="table-container rounded-2xl shadow-sm overflow-hidden">
            <div
              class="buscador-container p-4 flex flex-col lg:flex-row items-center justify-between gap-4"
            >
              <div
                class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full lg:w-auto flex-1"
              >
                <div class="relative flex-1 max-w-md">
                  <i
                    data-lucide="search"
                    class="absolute left-3 top-3 h-4 w-4 text-slate-400"
                  ></i>
                  <input
                    type="text"
                    id="searchInput"
                    autocomplete="off"
                    placeholder="Buscar por cliente o ciudad..."
                    class="buscador w-full pl-9 pr-4 py-2.5 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                  />
                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <div
                id="navbar-example2"
                class="table-responsive bg-body-dark p-0"
                data-bs-spy="scroll"
                data-bs-target="#navbar-example2"
                data-bs-root-margin="0px 0px -40%"
                data-bs-smooth-scroll="true"
                tabindex="0"
                style="
                  max-height: 600px;
                  overflow-y: auto;
                  scrollbar-color: #818181 #02001800;
                  scrollbar-width: none;
                "
              >
                <table class="w-full text-left border-collapse relative">
                  <thead>
                    <tr
                      class="table-head no-scrollbar text-center text-xs font-bold uppercase sticky top-0 z-10"
                    >
                      <th class="py-4 px-5 text-center">Número de Pedido</th>
                      <th class="py-4 px-5">Cliente / Usuario</th>
                      <th class="py-4 px-5">Fecha</th>
                      <th class="py-4 px-5">Total</th>
                      <th class="py-4 px-4 text-center estado">Estado</th>
                      <th class="py-4 px-5 text-center">Acciones</th>
                    </tr>
                  </thead>

                  <tbody id="tbody" class="text-sm">
                    <tr class="border-table"></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div
          id="view-formulario"
          class="hidden space-y-8 transition-opacity duration-300 mt-[30px]"
        >
          <div class="detalle-container p-4 rounded-4">
            <div
              class="escabezado-form flex flex-col sm:flex-row sm:items-center justify-between gap-4"
            >
              <div class="flex items-center space-x-4">
                <button
                  id="volver"
                  class="btn-return p-2.5 rounded-xl transition-all"
                  title="Regresar al listado"
                >
                  <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                  <h2
                    id="form-titulo-pantalla"
                    class="text-2xl md:text-3xl font-extrabold tracking-tight"
                  >
                    Numero de Pedido: <span id="detalle-id-venta"></span>
                  </h2>
                  <p class="text-sm">Fecha: <span id="detalle-fecha"></span></p>
                </div>
              </div>
            </div>

            <div
              class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6 p-4 rounded-md"
            >
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Cliente</span
                >
                <span id="detalle-cliente-nombre" class="font-medium">-</span>
              </div>
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Documento (RUC / CI)</span
                >
                <span id="detalle-cliente-documento" class="font-medium"
                  >-</span
                >
              </div>
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Teléfono</span
                >
                <span id="detalle-cliente-telefono" class="font-medium">-</span>
              </div>
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Dirección de Entrega</span
                >
                <span id="detalle-cliente-direccion" class="font-medium"
                  >-</span
                >
              </div>
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Observación</span
                >
                <span id="detalle-cliente-observacion" class="font-medium"
                  >-</span
                >
              </div>
              <div>
                <span class="block text-xs uppercase font-semibold"
                  >Método de Pago</span
                >
                <span id="detalle-metodo-pago" class="font-medium">-</span>
              </div>
            </div>
            <h3 class="font-semibold text-lg mb-3 px-3 border-b">
              Productos solicitados
            </h3>
            <div class="overflow-x-auto mb-6 py-2">
              <table class="w-full text-left border-collapse">
                <thead class="border-b">
                  <tr class="text-sm">
                    <th class="py-2 px-3">Producto</th>
                    <th class="py-2 px-3 text-center">Precio Unit.</th>
                    <th class="py-2 px-3 text-center">Cant.</th>
                    <th class="py-2 px-3 text-center">Subtotal</th>
                  </tr>
                </thead>
                <tbody id="tabla-items-detalle-body"></tbody>
              </table>
            </div>
            <div
              class="flex flex-col md:flex-row justify-between items-center pt-4 px-4 gap-4 border-t"
            >
              <div>
                <span class="text-sm">Monto Total del Pedido:</span>
                <div
                  id="detalle-monto-total"
                  class="text-2xl font-bold text-blue-600"
                >
                  Gs. 0
                </div>
              </div>

              <div class="flex gap-3">
                <button
                  id="btn-completar-venta"
                  class="px-6 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 transition"
                >
                  Finalizado
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="js/components/sidebarElement.js"></script>
    <script src="js/utils/theme.js"></script>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
    <script src="js/utils/scroll.js"></script>
    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/userInfo.js"></script>
    <script type="module" src="js/utils/dropdownNotif.js"></script>
    <script type="module" src="js/controllers/pedidosController.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
  </body>
</html>
