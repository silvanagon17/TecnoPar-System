<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control</title>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/notify.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="h-full transition-colors duration-200 flex flex-col font-sans">
    <header class="sticky position-fixed w-100 top-0 z-50 pre-scrollable">
      <div
        class="nav-principal-2 w-100 px-6 py-[12px] flex justify-between items-center gap-4"
      >
        <div class="d-flex items-center gap-2 cursor-pointer">
          <div>
            <img
              src="image/estatico/logoTecnoPar.png"
              class="logo mr-2"
              style="width: 26px"
              alt="Logo TecnoPar"
            />
          </div>
          <span class="titulo text-blue-500">TecnoPar</span>
        </div>

        <div class="flex items-center justify-content-between gap-4">
          <div class="mini-switch-container">
            <input type="checkbox" id="checkbox" class="checkbox-input" />
            <label for="checkbox" class="mini-label principal">
              <span class="icon-small">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.25"
                  stroke="currentColor"
                  class="size-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                  />
                </svg>
              </span>
              <span class="icon-small"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.25"
                  stroke="currentColor"
                  class="size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                  />
                </svg>
              </span>
              <div class="ball"></div>
            </label>
          </div>

          <div
            class="principal h-[32px] w-[35px] flex justify-center rounded-[11px]"
          >
            <button popovertarget="notificacion-sidebar" class="relative">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-bell-icon lucide-bell"
              >
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path
                  d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
                />
              </svg>
              <span
                id="cart-count"
                class="absolute top-[-3px] right-[-8px] bg-blue-400 text-[10px] font-black w-2.5 h-2.5 flex items-center justify-center rounded-full border-2 border-slate-600"
              ></span>
            </button>
          </div>

          <div class="user">
            <button
              class="flex items-center gap-2 hover:text-blue-400 transition group"
            >
              <div class="hidden lg:block text-left">
                <p class="text-xs text-slate-400">Mi Cuenta</p>
                <p class="user-name text-[14px] font-bold leading-tight">
                  Silvana Quintana
                </p>
              </div>
              <div
                class="w-[33px] h-[32px] rounded-[11px] flex items-center text-center justify-center group-hover:bg-slate-800 transition principal"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-user-round-icon lucide-user-round"
                >
                  <circle cx="12" cy="8" r="5" />
                  <path d="M20 21a8 8 0 0 0-16 0" />
                </svg>
              </div>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <app-sidebar></app-sidebar>

      <main class="flex-1 overflow-y-auto p-6 md:p-8 mt-[66px]">
        <div
          id="view-listado"
          class="space-y-8 transition-opacity duration-300"
        >
          <div id="notify-container"></div>

          <div
            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
          >
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                Panel Inicial
              </h2>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex items-center"
            >
              <div
                class="p-2 mr-4 w-12 h-12 bg-blue-500/30 text-blue-500 text-[20px] rounded-xl flex justify-center items-center border-1 border-blue-500/40"
              >
                <i data-lucide="package" class="w-8 h-8 shrink-0"></i>
              </div>
              <div>
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Productos Activos
                </p>
                <h3 id="stat-total" class="text-[26px] font-black mt-1">0</h3>
              </div>
            </div>

            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex items-center"
            >
              <div
                class="p-2 mr-4 w-12 h-12 bg-emerald-500/30 text-emerald-500 text-[29px] rounded-xl flex justify-center items-center border-1 border-green-500/40"
              >
                <i data-lucide="banknote-arrow-up" class="w-8 h-8 shrink-0"></i>
              </div>
              <div>
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Valor total est. (Activo)
                </p>
                <h3 id="stat-valor" class="text-[26px] font-black mt-1">
                  Gs 0
                </h3>
              </div>
            </div>

            <div
              class="dashboard-bg p-4 rounded-2xl shadow-sm flex items-center"
            >
              <div
                class="p-2 mr-4 w-12 h-12 bg-rose-500/30 text-rose-500 text-[20px] rounded-xl flex justify-center items-center border-1 border-rose-500/30"
              >
                <i data-lucide="triangle-alert" class="w-8 h-8 shrink-0"></i>
              </div>
              <div>
                <p
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider"
                >
                  Alerta de Stock
                </p>
                <h3
                  id="stat-critico"
                  class="text-[26px] font-black mt-1 text-rose-500"
                >
                  0
                </h3>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <script src="js/utils/theme.js"></script>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
    <script src="js/utils/scroll.js"></script>
    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/funcionalidades.js"></script>
    <script src="js/components/sidebarElement.js"></script>
  </body>
</html>
